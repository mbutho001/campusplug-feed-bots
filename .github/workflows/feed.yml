# Campus Plug feed bots: trend desk (Ayanda / Lwazi / Naledi + community personas) and the
# opportunity bots (Nomvula / Tshepo). Replaces the crontab on the home PC so posting no
# longer depends on that machine being switched on. tick.py decides what is due.
#
# State (engine.db, seen listings, logs, tick-state.json) lives in the PRIVATE repo
# mbutho001/campusplug-feed-state, pushed back after every tick as a single commit.
# Kill switch: add trend-bots/state/PAUSE to the state repo, or disable this workflow.
name: feed

on:
  schedule:
    - cron: "*/10 4-21 * * *"   # every 10 min, 06:00-23:50 SAST
  workflow_dispatch:
    inputs:
      only:
        description: "Run just these jobs (space-separated, e.g. 'publish scout'); empty = whatever is due"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # keepalive: re-enable this workflow so GitHub's 60-day idle rule never stops it

concurrency:
  group: feed      # one tick at a time: every job shares engine.db
  cancel-in-progress: false

env:
  TZ: Africa/Johannesburg

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/checkout@v4
        with:
          repository: mbutho001/campusplug-feed-state
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: .state

      - name: Set up
        env:
          CAMPUSPLUG_SUPABASE_URL: ${{ secrets.CAMPUSPLUG_SUPABASE_URL }}
          CAMPUSPLUG_SUPABASE_PUBLISHABLE: ${{ secrets.CAMPUSPLUG_SUPABASE_PUBLISHABLE }}
          CAMPUSPLUG_OPP_BOT_TOKEN: ${{ secrets.CAMPUSPLUG_OPP_BOT_TOKEN }}
          CAMPUSPLUG_TREND_BOT_TOKEN: ${{ secrets.CAMPUSPLUG_TREND_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: |
          pip install --quiet requests jsonschema
          rsync -a --exclude .git .state/ ./
          # The bots read their keys from the same files as on the home PC.
          umask 077
          mkdir -p ~/.config/campusplug ~/claude-code/qconnec/qconnec-mail
          printf '%s=%s\n' CAMPUSPLUG_SUPABASE_URL "$CAMPUSPLUG_SUPABASE_URL" \
            CAMPUSPLUG_SUPABASE_PUBLISHABLE "$CAMPUSPLUG_SUPABASE_PUBLISHABLE" \
            CAMPUSPLUG_OPP_BOT_TOKEN "$CAMPUSPLUG_OPP_BOT_TOKEN" \
            CAMPUSPLUG_TREND_BOT_TOKEN "$CAMPUSPLUG_TREND_BOT_TOKEN" > ~/.config/campusplug/app.env
          printf '%s=%s\n' GROQ_API_KEY "$GROQ_API_KEY" GEMINI_API_KEY "$GEMINI_API_KEY" > ~/.config/campusplug/llm.env
          cp mail/*.py ~/claude-code/qconnec/qconnec-mail/
          printf '%s=%s\n' GMAIL_USER "$GMAIL_USER" GMAIL_APP_PASSWORD "$GMAIL_APP_PASSWORD" \
            > ~/claude-code/qconnec/qconnec-mail/gmail_credentials.env
          # Report recipients are kept out of the public repo.
          python3 - <<'EOF'
          import json, os
          p = "trend-bots/config.json"
          c = json.load(open(p))
          c["report"]["recipients"] = [a.strip() for a in os.environ["REPORT_RECIPIENTS"].split(",") if a.strip()]
          json.dump(c, open(p, "w"), indent=2, ensure_ascii=False)
          EOF

      - name: Run due jobs
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python3 tick.py --only $ONLY
          else
            python3 tick.py
          fi

      - name: Save state
        if: always()
        run: |
          cd .state
          rm -rf trend-bots opportunities
          mkdir -p trend-bots opportunities/out opportunities/state
          cp ../tick-state.json . 2>/dev/null || true
          rsync -a --exclude '*.lock' --exclude 'crontab.backup*' ../trend-bots/state ../trend-bots/logs trend-bots/ 2>/dev/null || true
          cp ../opportunities/state/seen.sqlite3 opportunities/state/ 2>/dev/null || true
          rsync -a ../opportunities/logs opportunities/ 2>/dev/null || true
          # Only the listing JSON the opportunity bots post from, last 30 days (by the date in the name;
          # file mtimes are reset by every checkout).
          cutoff=$(date -d '30 days ago' +%F)
          cp ../opportunities/out/latest.json opportunities/out/ 2>/dev/null || true
          for f in ../opportunities/out/posts-*.json ../opportunities/out/opportunities-*.json; do
            [ -e "$f" ] || continue
            d=$(basename "$f" .json | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}$') || continue
            [[ "$d" > "$cutoff" ]] && cp "$f" opportunities/out/
          done
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          # A single orphan commit each time, so 144 ticks a day never bloat the repo history.
          git checkout --quiet --orphan snapshot
          git add -A
          git commit --quiet -m "state $(date '+%F %T')"
          git push --quiet --force origin snapshot:main

      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/feed.yml/enable" || true
